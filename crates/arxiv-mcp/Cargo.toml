[package]
name = "arxiv-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
arxiv-api-rs = { version = "0.1.0", path = "../arxiv-api-rs", features = ["html"] }
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
rmcp = { version = "3.5.0", features = ["server", "transport-io", "macros", "transport-streamable-http-server"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
